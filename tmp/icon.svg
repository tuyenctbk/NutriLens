<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#0A2E1C" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="30%" stop-color="#A7F3D0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#A7F3D0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Scanner Reticle Corners -->
  <g fill="none" stroke="#34D399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left -->
    <path d="M 120 170 L 120 120 L 170 120" />
    <!-- Top-Right -->
    <path d="M 342 120 L 392 120 L 392 170" />
    <!-- Bottom-Left -->
    <path d="M 120 342 L 120 392 L 170 392" />
    <!-- Bottom-Right -->
    <path d="M 342 392 L 392 392 L 392 342" />
  </g>

  <!-- Center Nutrition Shield / Organic Leaf Base -->
  <path d="M 256 145 C 185 145 155 200 155 260 C 155 330 225 385 256 395 C 287 385 357 330 357 260 C 357 200 327 145 256 145 Z" fill="url(#leafGrad)" />

  <!-- Barcode Pattern Inside Shield -->
  <g fill="#064E3B">
    <rect x="195" y="220" width="10" height="70" rx="3" />
    <rect x="215" y="205" width="18" height="100" rx="4" />
    <rect x="243" y="195" width="12" height="120" rx="3" />
    <rect x="265" y="195" width="22" height="120" rx="4" />
    <rect x="297" y="205" width="10" height="100" rx="3" />
    <rect x="317" y="225" width="8" height="60" rx="2" />
  </g>

  <!-- Center Laser Beam with Glow -->
  <rect x="100" y="252" width="312" height="8" rx="4" fill="url(#laserGrad)" filter="url(#glow)" />
  <line x1="110" y1="256" x2="402" y2="256" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
</svg>
